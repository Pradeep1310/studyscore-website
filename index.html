<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prestige immigration consultant directory with verified profile intelligence, lead gateway, and destination-focused service metrics." />
  <title>Prestige Agent Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          colors: { slateglass: "rgba(15,23,42,.66)", platinum: "#e5e7eb", ambercore: "#f59e0b" },
          boxShadow: { glow: "0 0 40px rgba(245,158,11,.18)", silver: "0 24px 90px rgba(148,163,184,.13)" },
          animation: { pulseAmber: "pulseAmber 2.4s ease-in-out infinite", fadeIn: "fadeIn .38s ease-out both", float: "float 6s ease-in-out infinite" },
          keyframes: {
            pulseAmber: { "0%,100%": { boxShadow: "0 0 0 rgba(245,158,11,.1)" }, "50%": { boxShadow: "0 0 32px rgba(245,158,11,.42)" } },
            fadeIn: { from: { opacity: 0, transform: "translateY(10px)" }, to: { opacity: 1, transform: "translateY(0)" } },
            float: { "0%,100%": { transform: "translateY(0)" }, "50%": { transform: "translateY(-10px)" } }
          }
        }
      }
    };
  </script>
  <style>
    *{box-sizing:border-box} body{min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(245,158,11,.13),transparent 34%),radial-gradient(circle at 80% 10%,rgba(148,163,184,.14),transparent 32%),linear-gradient(135deg,#020617,#0f172a 46%,#111827);color:#e5e7eb} .glass{background:rgba(15,23,42,.62);backdrop-filter:blur(18px);border:1px solid rgba(226,232,240,.12);box-shadow:0 20px 70px rgba(0,0,0,.28)} .glass-hover{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}.glass-hover:hover{transform:translateY(-3px);border-color:rgba(245,158,11,.38);box-shadow:0 0 48px rgba(245,158,11,.13),0 26px 80px rgba(0,0,0,.34)} .btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border-radius:999px;padding:.82rem 1.1rem;font-weight:700;transition:all .2s ease}.btn-primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#111827;box-shadow:0 16px 40px rgba(245,158,11,.28)} .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)} .btn-ghost{border:1px solid rgba(226,232,240,.14);background:rgba(255,255,255,.04);color:#e5e7eb}.btn-ghost:hover{border-color:rgba(226,232,240,.32);background:rgba(255,255,255,.08)} input,select,textarea{width:100%;border-radius:1rem;border:1px solid rgba(226,232,240,.13);background:rgba(2,6,23,.58);padding:.88rem 1rem;color:#f8fafc;outline:none} input:focus,select:focus,textarea:focus{border-color:rgba(245,158,11,.58);box-shadow:0 0 0 4px rgba(245,158,11,.08)} .metric-active{border-color:rgba(245,158,11,.5)!important;background:rgba(245,158,11,.08)!important}.legal p{margin:.75rem 0;color:#cbd5e1;line-height:1.8}.legal h2{margin-top:1.5rem;color:#f8fafc;font-size:1.25rem;font-weight:800}
  </style>
</head>
<body class="font-sans antialiased">
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-24 left-1/4 h-72 w-72 rounded-full bg-amber-500/10 blur-3xl animate-float"></div>
    <div class="absolute bottom-10 right-10 h-80 w-80 rounded-full bg-slate-300/10 blur-3xl animate-float" style="animation-delay:1.2s"></div>
  </div>

  <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/72 backdrop-blur-xl">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <a href="#/agents" class="flex items-center gap-3">
        <span class="grid h-10 w-10 place-items-center rounded-2xl bg-amber-400 text-slate-950 font-black shadow-glow">P</span>
        <span>
          <span class="block text-sm font-black tracking-[.22em] text-slate-100">PRESTIGE</span>
          <span class="block text-xs text-slate-400">Agent Intelligence Network</span>
        </span>
      </a>
      <div class="flex items-center gap-2 text-sm">
        <a class="btn btn-ghost px-4 py-2" href="#/agents">Directory</a>
        <a class="hidden sm:inline-flex btn btn-ghost px-4 py-2" href="#/privacy">Privacy</a>
        <a class="hidden sm:inline-flex btn btn-ghost px-4 py-2" href="#/terms">Terms</a>
      </div>
    </nav>
  </header>

  <main id="app" class="relative z-10 mx-auto min-h-screen max-w-7xl px-4 py-8 sm:px-6 lg:px-8"></main>

  <template id="contact-template">
    <aside class="glass sticky top-24 rounded-[1.5rem] p-5">
      <div class="mb-5">
        <p class="text-xs font-bold uppercase tracking-[.24em] text-amber-300">Secure Inbound Lead Gateway</p>
        <h3 class="mt-2 text-2xl font-black text-white">Request a private callback</h3>
        <p class="mt-2 text-sm leading-6 text-slate-400">Encrypted intake routed directly to this workspace for profile-specific follow-up.</p>
      </div>
      <form id="leadForm" class="space-y-3">
        <input name="name" required placeholder="Full name" autocomplete="name" />
        <input name="email" required type="email" placeholder="Email address" autocomplete="email" />
        <input name="phone" required placeholder="Phone / WhatsApp" autocomplete="tel" />
        <select name="destination" required></select>
        <textarea name="message" rows="4" placeholder="Briefly describe your study, work, or visa goal"></textarea>
        <button class="btn btn-primary w-full" type="submit">Submit Secure Lead</button>
        <p id="formStatus" class="min-h-6 text-sm text-slate-400"></p>
      </form>
    </aside>
  </template>

  <script>
    const agents = [
      { city:"delhi", slug:"northstar-global-visas", name:"Northstar Global Visas", claimed:false, rating:"4.8", address:"Connaught Place, New Delhi", phone:"+91 11 4000 1200", alumni:1840, sla:36, success:92, destinations:["Canada","United Kingdom","Australia","Germany","New Zealand"], specialties:["Student Visa","PR Pathways","Skilled Migration"], summary:"A destination-led immigration desk with strong documentation discipline, alumni proof trails, and premium case intake." },
      { city:"mumbai", slug:"atlas-overseas-advisory", name:"Atlas Overseas Advisory", claimed:true, rating:"4.9", address:"Bandra Kurla Complex, Mumbai", phone:"+91 22 6100 4500", alumni:2615, sla:24, success:95, destinations:["United States","Canada","Ireland","France","Singapore"], specialties:["F-1 Visa","MBA Admissions","Work Permits"], summary:"Executive-grade consulting for high-intent applicants seeking fast document review, interview preparation, and admissions alignment." },
      { city:"bangalore", slug:"summit-edu-mobility", name:"Summit Edu Mobility", claimed:false, rating:"4.7", address:"Indiranagar, Bengaluru", phone:"+91 80 4700 8800", alumni:1320, sla:48, success:89, destinations:["Australia","Germany","Netherlands","Sweden","Canada"], specialties:["STEM Admissions","Blocked Account","Post Study Work"], summary:"Technology-focused mobility advisory for students and professionals targeting European and Pacific pathways." }
    ];

    const app = document.getElementById("app");
    const fmt = new Intl.NumberFormat("en-IN");
    const route = () => {
      const hash = location.hash || "#/agents";
      const parts = hash.replace(/^#\/?/, "").split("/");
      if (parts[0] === "privacy") return renderLegal("privacy");
      if (parts[0] === "terms") return renderLegal("terms");
      if (parts[0] === "agents" && parts[1] && parts[2]) return renderProfile(parts[1], parts[2]);
      return renderDirectory();
    };

    function shell(html){ app.innerHTML = `<section class="animate-fadeIn">${html}</section>`; }

    function renderDirectory(){
      removeSchema();
      shell(`
        <section class="grid gap-8 lg:grid-cols-[1fr_360px]">
          <div>
            <div class="glass rounded-[2rem] p-7 sm:p-10">
              <p class="text-xs font-black uppercase tracking-[.28em] text-amber-300">Zomato Prestige HUD</p>
              <h1 class="mt-4 max-w-4xl text-4xl font-black tracking-tight text-white sm:text-6xl">A cinematic directory for high-trust immigration workspaces.</h1>
              <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-300">Browse profile intelligence, destination coverage, response SLAs, alumni validation, and verified consultant intake channels.</p>
              <div class="mt-7 flex flex-wrap gap-3">${["Canada","UK","Australia","USA","Germany","Ireland"].map(x=>`<span class="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-200">${x}</span>`).join("")}</div>
            </div>
            <div class="mt-8 grid gap-4">
              ${agents.map(a=>`
                <a href="#/agents/${a.city}/${a.slug}" class="glass glass-hover block rounded-[1.5rem] p-5">
                  <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
                    <div>
                      <div class="flex flex-wrap items-center gap-2">
                        <h2 class="text-2xl font-black text-white">${a.name}</h2>
                        ${a.claimed ? `<span class="rounded-full bg-emerald-400/12 px-3 py-1 text-xs font-bold text-emerald-300">Verified Workspace</span>` : `<span class="rounded-full bg-amber-400/12 px-3 py-1 text-xs font-bold text-amber-300">Audit Pending</span>`}
                      </div>
                      <p class="mt-2 text-sm text-slate-400">${a.address}</p>
                      <div class="mt-4 flex flex-wrap gap-2">${a.destinations.map(d=>`<span class="rounded-full border border-slate-200/10 px-3 py-1 text-xs text-slate-300">${d}</span>`).join("")}</div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center sm:w-72">
                      <span class="rounded-2xl bg-white/5 p-3"><b class="block text-xl text-white">${a.success}%</b><small class="text-slate-400">Success</small></span>
                      <span class="rounded-2xl bg-white/5 p-3"><b class="block text-xl text-white">${a.sla}h</b><small class="text-slate-400">SLA</small></span>
                      <span class="rounded-2xl bg-white/5 p-3"><b class="block text-xl text-white">${fmt.format(a.alumni)}</b><small class="text-slate-400">Alumni</small></span>
                    </div>
                  </div>
                </a>`).join("")}
            </div>
          </div>
          <div class="glass rounded-[1.5rem] p-6 h-max">
            <p class="text-xs font-bold uppercase tracking-[.24em] text-slate-400">Network Signal</p>
            <h3 class="mt-3 text-3xl font-black text-white">${fmt.format(agents.reduce((s,a)=>s+a.alumni,0))}</h3>
            <p class="mt-2 text-sm leading-6 text-slate-400">Verified alumni records indexed across active destination corridors.</p>
          </div>
        </section>`);
    }

    function renderProfile(city, slug){
      const a = agents.find(x => x.city === city && x.slug === slug) || agents[0];
      injectSchema(a);
      shell(`
        <section class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_380px]">
          <div>
            <div class="glass overflow-hidden rounded-[2rem]">
              <div class="relative p-6 sm:p-10">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_80%_20%,rgba(245,158,11,.16),transparent_35%)]"></div>
                <div class="relative">
                  <div class="flex flex-wrap gap-2">${a.destinations.map(d=>`<span class="rounded-full border border-amber-300/20 bg-amber-300/8 px-3 py-1 text-xs font-bold text-amber-200">${d}</span>`).join("")}</div>
                  <div class="mt-6 flex flex-col justify-between gap-5 xl:flex-row xl:items-end">
                    <div>
                      <p class="text-xs font-black uppercase tracking-[.3em] text-slate-400">${a.city.replace(/^\w/,c=>c.toUpperCase())} Prestige Profile</p>
                      <h1 class="mt-3 text-4xl font-black tracking-tight text-white sm:text-6xl">${a.name}</h1>
                      <p class="mt-4 max-w-3xl text-lg leading-8 text-slate-300">${a.summary}</p>
                    </div>
                    <div class="rounded-[1.25rem] border border-white/10 bg-white/5 p-4 text-right">
                      <p class="text-sm text-slate-400">Public Rating</p>
                      <p class="text-4xl font-black text-white">${a.rating}</p>
                    </div>
                  </div>
                  ${!a.claimed ? `<div class="mt-7 flex flex-col gap-4 rounded-[1.4rem] border border-amber-300/25 bg-amber-400/10 p-4 shadow-glow animate-pulseAmber sm:flex-row sm:items-center sm:justify-between"><div><p class="font-black text-amber-100">Provisional Listing • Audit Pending</p><p class="mt-1 text-sm text-amber-100/70">This workspace can verify ownership, enrich service evidence, and activate profile controls.</p></div><button class="btn btn-primary" onclick="document.getElementById('leadForm')?.scrollIntoView({behavior:'smooth',block:'center'})">Claim Workspace</button></div>` : ""}
                </div>
              </div>
            </div>

            <div class="mt-8 grid gap-4 md:grid-cols-3" id="metrics">
              ${metric("Visa Success Coefficient", a.success+"%", "Case approval strength across recent documented cohorts.", "success")}
              ${metric("Turnaround SLA Timer", a.sla+"h", "Average first-response and document triage commitment.", "sla")}
              ${metric("Verified Alumni Count", fmt.format(a.alumni), "Indexed applicants with destination and outcome validation.", "alumni")}
            </div>

            <div class="mt-8 glass rounded-[1.5rem] p-6">
              <h2 class="text-2xl font-black text-white">Workspace Intelligence</h2>
              <div class="mt-5 grid gap-4 sm:grid-cols-2">
                ${a.specialties.map(s=>`<div class="rounded-2xl border border-white/10 bg-white/[.04] p-4"><p class="font-bold text-white">${s}</p><p class="mt-2 text-sm leading-6 text-slate-400">Dedicated advisory flow with document validation and milestone tracking.</p></div>`).join("")}
              </div>
              <div class="mt-6 rounded-2xl border border-white/10 bg-slate-950/40 p-5">
                <p class="text-sm text-slate-400">Registered contact</p>
                <p class="mt-1 font-bold text-slate-100">${a.address} · ${a.phone}</p>
              </div>
            </div>
          </div>
          <div id="contactMount"></div>
        </section>`);
      mountContact(a);
      document.querySelectorAll("[data-metric]").forEach(card => card.addEventListener("click", () => {
        document.querySelectorAll("[data-metric]").forEach(x => x.classList.remove("metric-active"));
        card.classList.add("metric-active");
      }));
    }

    function metric(title, value, copy, key){
      return `<button data-metric="${key}" class="glass glass-hover rounded-[1.5rem] p-5 text-left">
        <span class="text-xs font-black uppercase tracking-[.2em] text-slate-400">${title}</span>
        <strong class="mt-3 block text-4xl font-black text-white">${value}</strong>
        <span class="mt-3 block text-sm leading-6 text-slate-400">${copy}</span>
      </button>`;
    }

    function mountContact(a){
      const node = document.getElementById("contact-template").content.cloneNode(true);
      document.getElementById("contactMount").appendChild(node);
      const form = document.getElementById("leadForm"), status = document.getElementById("formStatus"), select = form.destination;
      select.innerHTML = `<option value="">Destination interest</option>` + a.destinations.map(d=>`<option>${d}</option>`).join("");
      form.addEventListener("submit", async e => {
        e.preventDefault();
        status.textContent = "Submitting secure lead...";
        const body = Object.fromEntries(new FormData(form).entries());
        body.agent_slug = a.slug; body.agent_city = a.city; body.source = location.href; body.timestamp = new Date().toISOString();
        try {
          const res = await fetch(`/api/public/leads/${a.slug}`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
          if (!res.ok) throw new Error("Lead gateway rejected the request.");
          status.textContent = "Lead received. The workspace will respond shortly.";
          status.className = "min-h-6 text-sm text-emerald-300";
          form.reset();
        } catch (err) {
          status.textContent = "Unable to submit right now. Please retry in a moment.";
          status.className = "min-h-6 text-sm text-rose-300";
        }
      });
    }

    function renderLegal(type){
      removeSchema();
      const isPrivacy = type === "privacy";
      shell(`
        <article class="glass legal mx-auto max-w-4xl rounded-[2rem] p-7 sm:p-10">
          <p class="text-xs font-black uppercase tracking-[.28em] text-amber-300">${isPrivacy ? "Privacy Notice" : "Terms of Use"}</p>
          <h1 class="mt-4 text-4xl font-black text-white">${isPrivacy ? "Privacy Policy" : "Terms and Conditions"}</h1>
          <p>Effective date: July 7, 2026. This page explains the operating standards for the Prestige Agent Directory, including profile discovery, inbound lead handling, compliance notices, and user obligations.</p>
          ${isPrivacy ? privacyCopy() : termsCopy()}
        </article>`);
    }

    function privacyCopy(){ return `
      <h2>Information We Collect</h2><p>We may collect contact details, destination interests, form messages, device metadata, referral URLs, profile interactions, and operational records needed to route inquiries to listed workspaces.</p>
      <h2>How We Use Information</h2><p>Information is used to process lead requests, support profile verification, prevent misuse, improve directory quality, maintain audit logs, and comply with lawful obligations.</p>
      <h2>Sharing and Disclosure</h2><p>Lead submissions may be shared with the specific agent profile selected by the user. We do not sell personal information. We may disclose data to service providers, security partners, and authorities where legally required.</p>
      <h2>Retention and Security</h2><p>Records are retained only for legitimate business, compliance, and dispute-resolution needs. Administrative, technical, and organizational safeguards are used to reduce unauthorized access risk.</p>
      <h2>Your Choices</h2><p>Users may request access, correction, deletion, or restriction of personal data where applicable law grants those rights. Some records may be retained when required for legal, fraud-prevention, or operational reasons.</p>
      <h2>International Transfers</h2><p>Because immigration services often involve multiple countries, information may be processed across jurisdictions subject to appropriate safeguards and applicable legal requirements.</p>
      <h2>Contact</h2><p>Privacy requests can be submitted through the directory operator’s official support channel with sufficient information to verify the request.</p>`; }

    function termsCopy(){ return `
      <h2>Directory Role</h2><p>The platform provides profile discovery, business information, and lead routing. It does not provide legal, immigration, financial, or admissions advice and does not guarantee any visa, admission, employment, or migration outcome.</p>
      <h2>User Responsibilities</h2><p>Users must provide accurate information, evaluate any consultant independently, verify credentials before engagement, and avoid submitting unlawful, misleading, confidential, or third-party data without authority.</p>
      <h2>Profile Accuracy</h2><p>Some listings may be provisional, unclaimed, or pending audit. Ratings, alumni indicators, SLA metrics, and success coefficients are directory signals and should be treated as informational rather than guarantees.</p>
      <h2>Lead Routing</h2><p>By submitting a form, users authorize the directory to transmit inquiry details to the selected workspace and related service systems for response, qualification, and recordkeeping.</p>
      <h2>Acceptable Use</h2><p>Scraping, abusive automation, impersonation, security testing without permission, spam submissions, and attempts to interfere with platform availability are prohibited.</p>
      <h2>Limitation of Liability</h2><p>The directory is provided on an as-available basis. To the maximum extent permitted by law, the operator is not liable for indirect losses, consultant conduct, application outcomes, or third-party service decisions.</p>
      <h2>Changes</h2><p>Terms may be updated from time to time. Continued use after publication of revised terms constitutes acceptance of the updated version.</p>`; }

    function injectSchema(a){
      removeSchema();
      const script = document.createElement("script");
      script.type = "application/ld+json"; script.id = "active-profile-schema";
      script.textContent = JSON.stringify({
        "@context":"https://schema.org","@type":"LocalBusiness",name:a.name,address:a.address,telephone:a.phone,aggregateRating:{"@type":"AggregateRating",ratingValue:a.rating,bestRating:"5",ratingCount:Math.max(25, Math.round(a.alumni/12))},areaServed:a.destinations,description:a.summary,url:location.href
      });
      document.head.appendChild(script);
    }
    function removeSchema(){ document.getElementById("active-profile-schema")?.remove(); }

    addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
